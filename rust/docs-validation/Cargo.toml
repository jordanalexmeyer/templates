[package]
name = "stagehand-automation"
version = "0.1.0"
edition = "2021"

[dependencies]
stagehand_sdk = { version = "0.3", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dotenvy = "0.15"
futures = "0.3"
