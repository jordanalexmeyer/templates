# Full TypeScript → JavaScript mirror (entire `typescript/` tree). This workflow no
# longer runs on branch pushes or opens PRs — generated `javascript/` is committed
# only from the production playground workflow. Use this job manually when you need a
# one-off full build in CI (artifacts are not pushed to the repo).

name: Build JavaScript Templates (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build javascript templates (full tree; not committed)
        run: pnpm run build:javascript
